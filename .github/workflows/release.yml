name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained single file, win-x64)
        run: >
          dotnet publish CanUSB/CanUSB.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Package zip
        shell: pwsh
        run: |
          $name = "CanUSB-${{ github.ref_name }}-win-x64"
          Compress-Archive -Path publish\* -DestinationPath "$name.zip"
          Write-Host "packed $name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanUSB-win-x64
          path: CanUSB-*-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CanUSB-*-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
